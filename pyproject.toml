[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echolabel"
version = "0.0.0"
description = "Interactive echogram labelling tools"
readme = "README.md"
authors = [{name = "Gaspard Ringuenet", email = "gaspard.ringuenet@proton.me"}]
requires-python = ">=3.11"
dependencies = [
    "dask>=2026.3.0,<2026.4.0",
    "labelme==6.0.0",
    "matplotlib>=3.10.8",
    "numpy<=1.26.4",
    "netcdf4>=1.7.3",
    "pandas>=2.3.3",
    "Pillow>=12.0.0",
    "requests>=2.34.0",
    "scipy<1.15.2",
    "tqdm>=4.68.0",
    "xarray>=2025.6.1",
    "platformdirs>=4.9.4",
    "echoregions>=0.2.3",
    "click>=8.3.2",
    "zarr>=2.18.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
]

[project.scripts]
echolabel = "echolabel.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echolabel = ["config/config.default.yaml"]

[tool.ruff]
line-length = 120
