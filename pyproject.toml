[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echolabel"
version = "0.0.0"
description = "Interactive echogram labelling tools"
readme = "README.md"
authors = [{name = "Gaspard Ringuenet", email = "gaspard.ringuenet@proton.me"}]
requires-python = ">=3.11"
dependencies = [
    "dash",
    "dash-ag-grid",
    "dask",
    "flask",
    "labelme==6.0.0",
    "matplotlib",
    "numpy",
    "netcdf4",
    "pandas",
    "Pillow",
    "plotly",
    "requests",
    "scikit-learn",
    "scipy",
    "tqdm",
    "xarray",
    "platformdirs>=4.9.4",
    "rich>=14.3.3",
    "echoregions>=0.2.3",
    "click>=8.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
]

[project.scripts]
echolabel = "echolabel.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echolabel = ["config/config.default.yaml"]

[tool.ruff]
line-length = 120
