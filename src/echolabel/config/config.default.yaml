# list which frequencies to display (empty list: use first channel)
channels_frequency_nominal:

# image size
frame_width: 10000 # x axis
range_samples_slice: # y axis
    start: 0
    stop: null

# colormapping
vmin: -90.0
vmax: -50.0
echogram_cmap: "viridis"
bg_color: "grey"

# whether to run whith cached data (images + LabelMe shapes)
reuse_images: false # TODO: change param name
